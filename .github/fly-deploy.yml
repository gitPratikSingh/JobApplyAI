name: Deploy to Fly.io

# Per the hosting ADR: merge to main -> this workflow deploys -> live.
# Rollback is a revert on GitHub.
#
# Requires the repository secret FLY_API_TOKEN, holding an app-scoped Fly
# deploy token (created with `fly tokens create deploy`, scoped to the
# web app only — never a personal/full-access token). Only a repo admin
# can add Actions secrets, so Bhanu (repo owner) adds it, or this workflow
# runs from the fork instead; see docs/fly-deployment-notes.md.
#
# Phase 1 is a single app (SQLite on a Fly volume — see fly.toml), so this
# workflow is the whole deploy story. One-time setup (app, volume,
# secrets) is scripts/fly-bootstrap.sh, run by hand once.

on:
  push:
    branches: [main]

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web app to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: flyctl deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
